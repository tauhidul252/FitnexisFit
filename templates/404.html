{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="auth-section" style="text-align: center;">
    <div class="auth-card" style="max-width: 600px;">
        <h1 style="font-size: 8rem; color: var(--accent); line-height: 1; margin-bottom: 0;">404</h1>
        <h2 style="margin-bottom: 1.5rem;">PAGE <span class="highlight">NOT FOUND</span></h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        <a href="{% url 'home' %}" class="btn-primary">BACK TO HOME</a>
    </div>
</section>
{% endblock %}
