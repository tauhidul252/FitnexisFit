{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h2>RECOVER <span class="highlight">PASSWORD</span></h2>
        <p style="color: var(--text-muted); text-align: center; margin-bottom: 2rem;">Enter your email address and we'll send you a link to reset your password.</p>
        <form class="auth-form" method="POST" action="">
            {% csrf_token %}
            <div class="form-group">
                <input type="email" name="email" placeholder="Email Address" required>
            </div>
            <button type="submit" class="btn-primary full-width">SEND RESET LINK</button>
        </form>
        <p class="auth-footer">Remember your password? <a href="{% url 'login' %}" class="highlight">Login</a></p>
    </div>
</section>
{% endblock %}
